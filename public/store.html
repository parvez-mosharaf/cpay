<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CPAY creator storefront"><title>CPAY Store</title><link rel="icon" href="/favicon-site.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--accent:#00D632;--bg:#070a08;--panel:rgba(18,23,20,.82);--line:rgba(255,255,255,.09);--text:#f3f8f4;--dim:rgba(243,248,244,.62)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 44%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 16px 60px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.04em}.mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#071009;display:grid;place-items:center}.hero{text-align:center;padding:54px 10px 30px}.avatar{width:92px;height:92px;border-radius:28px;background:var(--accent);color:#071009;display:grid;place-items:center;margin:0 auto 16px;font-size:30px;font-weight:900;object-fit:cover;box-shadow:0 18px 60px color-mix(in srgb,var(--accent) 18%,transparent)}.hero h1{font-size:34px;line-height:1.05;margin:0 0 9px;letter-spacing:-.04em}.hero p{margin:0 auto;color:var(--dim);max-width:560px;line-height:1.55}.bio{margin-top:10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:19px;backdrop-filter:blur(16px);box-shadow:0 12px 35px rgba(0,0,0,.18)}.card h2{font-size:17px;margin:0 0 7px}.slug{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}.pay{display:block;text-align:center;text-decoration:none;margin-top:17px;background:var(--accent);color:#071009;padding:13px;border-radius:13px;font-weight:900;font-size:13px}.foot{text-align:center;color:rgba(255,255,255,.32);font-size:11px;margin-top:38px}.empty{text-align:center;padding:45px 20px;color:var(--dim)}.share{display:inline-flex;margin-top:18px;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.05);padding:10px 15px;border-radius:999px;font-weight:800;cursor:pointer}.snow{--bg:#f5faf7;--panel:rgba(255,255,255,.85);--line:rgba(12,32,20,.12);--text:#102018;--dim:rgba(16,32,24,.62)}.glass{--bg:#090b14}.sunset{--bg:#110908;--panel:rgba(35,17,14,.82)}
</style></head><body><main class="wrap"><div class="brand"><div class="mark">$</div><div>CPAY</div></div><section class="hero"><div class="avatar" id="avatar">$</div><h1 id="name">Loading…</h1><p id="tagline">Choose a payment option</p><p id="bio" class="bio"></p><button id="share" class="share" hidden>Share store</button></section><section id="grid" class="grid"></section><div id="state" class="empty">Loading storefront…</div><div class="foot">Powered by CPAY</div></main><script>
const sb=window.supabaseClient,params=new URLSearchParams(location.search),uid=params.get('u');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{if(!uid){state.textContent='Store not found.';return}const {data,error}=await sb.rpc('get_public_store',{p_user_id:uid});if(error||!data?.length){state.textContent='Store not found or unavailable.';return}const r=data[0];document.title=(r.display_name||'CPAY creator')+' — CPAY';document.body.className=r.theme||'midnight';document.documentElement.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(r.accent||'')?r.accent:'#00D632');name.textContent=r.display_name||'CPAY creator';tagline.textContent=r.tagline||'Choose a payment option';bio.textContent=r.bio||'';bio.style.display=r.bio?'block':'none';if(r.avatar_url){avatar.innerHTML='';avatar.src=r.avatar_url;avatar.style.padding='0';avatar.alt=r.display_name||'Creator';}else avatar.textContent=(r.display_name||'$').trim().charAt(0).toUpperCase()||'$';const links=Array.isArray(r.links)?r.links:[];state.style.display='none';grid.innerHTML=links.length?links.map(l=>`<article class="card"><h2>${esc(l.display_name||l.slug)}</h2><div class="slug">/${esc(l.slug)}</div><a class="pay" href="/${encodeURIComponent(l.slug)}">${esc(r.cta||'Pay now')}</a></article>`).join(''):'<div class="empty">No active payment links yet.</div>';share.hidden=false;share.onclick=async()=>{const url=location.href;if(navigator.share)try{await navigator.share({title:r.display_name||'CPAY Store',text:r.tagline||'Payment options',url})}catch{}else{try{await navigator.clipboard.writeText(url);share.textContent='Store URL copied';setTimeout(()=>share.textContent='Share store',1800)}catch{}}};})();
</script></body></html>
